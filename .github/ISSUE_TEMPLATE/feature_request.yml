name: 기능 제안
description: 새로운 기능이나 개선 아이디어를 제안해주세요.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: 사전 확인
      options:
        - label: 기존 이슈에서 비슷한 제안을 검색했습니다.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 이 기능이 필요한 이유나 현재의 불편을 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 동작
      description: 사용자의 관점에서 기능이 어떻게 동작하면 좋을지 설명해주세요.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 관련 영역
      options:
        - 절차적 애니메이션 및 물리
        - 잡기 및 던지기 상호작용
        - 데스크톱 오버레이
        - DMS 스킨 호환성
        - 설정 및 사용자 인터페이스
        - 멀티 모니터 및 플랫폼 지원
        - 개발 도구 및 문서
        - 기타
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 대안
      description: 고려한 다른 해결 방법이나 우회 방법이 있다면 적어주세요.

  - type: textarea
    id: context
    attributes:
      label: 추가 정보
      description: 참고 자료, 간단한 그림 또는 호환성 고려사항을 추가해주세요. 권한 없는 게임 에셋은 첨부하지 마세요.

  - type: checkboxes
    id: scope
    attributes:
      label: 프로젝트 범위 확인
      options:
        - label: 이 제안이 데스크톱 컴패니언 또는 DMS 호환성 목표와 관련되어 있습니다.
          required: true
