name: Temporary food pointer fix

on:
  push:
    branches:
      - fix/food-placement-pointer-space
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-push:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/food-placement-pointer-space
          fetch-depth: 0

      - name: Patch pointer spaces
        shell: powershell
        run: python .github/temp-food-pointer-patch.py

      - name: Build Release and run tests
        shell: powershell
        run: .\build.ps1 -Configuration Release

      - name: Check DMS validator syntax
        shell: powershell
        run: node --check tools/validate-dms-template.mjs

      - name: Commit validated fix
        shell: powershell
        run: |
          Remove-Item .github/workflows/temp-food-pointer-fix.yml
          Remove-Item .github/temp-food-pointer-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: keep food placement in world pointer space"
          git push origin HEAD:fix/food-placement-pointer-space
