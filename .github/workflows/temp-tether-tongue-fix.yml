name: Temporary tether tongue size fix

on:
  push:
    branches:
      - fix/spearmaster-tether-saint-size

permissions:
  contents: write

jobs:
  patch-build-push:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch scaled tether and tongue behavior
        shell: powershell
        run: |
          @'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}\n--- needle ---\n{old}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          spear = "src/RainWorldDesktopPet/Physics/DesktopSpear.cs"
          replace_once(spear,
          '''        private double[] umbilicalLifeDecay;''',
          '''        private double[] umbilicalLifeDecay;
                  private double connectionScale = 1.0;''')

          replace_once(spear,
          '''        public void SetConnectionAnchor(Vec2 position)
                  {
                      ConnectionAnchor = position;
                  }''',
          '''        public void SetConnectionAnchor(Vec2 position)
                  {
                      ConnectionAnchor = position;
                      // Graphics updates the Spearmaster tail after the physical spear tick.
                      // Snap the live tail endpoint immediately so the tether cannot lag one
                      // frame behind the visible tail hole at small/normal character sizes.
                      if (umbilical != null && umbilical.Length > 0 &&
                          LifeOfUmbilicalSegment(0) > 0.0)
                      {
                          umbilical[0] = position;
                          umbilicalVelocity[0] = Vec2.Zero;
                      }
                  }

                  public void SetConnectionScale(double value)
                  {
                      if (value <= 0.0 || double.IsNaN(value) || double.IsInfinity(value))
                          throw new ArgumentOutOfRangeException("value");
                      connectionScale = value;
                      if (umbilical != null && umbilical.Length > 0)
                      {
                          int last = umbilical.Length - 1;
                          if (LifeOfUmbilicalSegment(last) > 0.0)
                          {
                              umbilical[last] = Chunk.Position - Rotation *
                                  (25.0 * connectionScale);
                              umbilicalVelocity[last] = Vec2.Zero;
                          }
                      }
                  }''')

          replace_once(spear,
          '''                umbilical[last] = Chunk.Position - Rotation * 25.0;''',
          '''                umbilical[last] = Chunk.Position - Rotation *
                              (25.0 * connectionScale);''')

          abilities = "src/RainWorldDesktopPet/Creature/SlugcatAbilities.cs"
          replace_once(abilities,
          '''            return hips + awayFromChest * 8.0;''',
          '''            return hips + awayFromChest * (8.0 * Owner.SizeMovementScale);''')

          replace_once(abilities,
          '''        private const int RopeSegments = 20;
                  private readonly Vec2[] rope = new Vec2[RopeSegments];''',
          '''        private const int RopeSegments = 20;
                  // Canonical Saint tongue distances are the existing Large-size values.
                  // Small/Normal scale these spatial values by the same multiplier as the
                  // Slugcat rather than inheriting Large reach.
                  private const double LargeRequestedLength = 140.0;
                  private const double LargeIdealLength = 150.0;
                  private const double LargeMinimumIdealLength = 50.0;
                  private const double LargeMaximumIdealLength = 170.0;
                  private const double LargeElasticRopeLength = 200.0;
                  private const double LargeRopePadding = 80.0;
                  private const double LargeSafetyLength = 500.0;
                  private const double LargeShotOffset = 5.0;
                  private const double LargeShotSpeed = 70.0;
                  private const double LargeReturnDistance = 40.0;
                  private const double LargeAutoAimDistance = 230.0;
                  private readonly Vec2[] rope = new Vec2[RopeSegments];''')

          replace_once(abilities,
          '''        private double requestedLength = 140.0;
                  private double idealLength = 150.0;''',
          '''        // These remain in canonical Large-size units. Convert to physical
                  // simulation distance only at the point where the rope uses them.
                  private double requestedLength = LargeRequestedLength;
                  private double idealLength = LargeIdealLength;''')

          replace_once(abilities,
          '''        public double RopeTotalLength { get { return desktopRope.TotalLength; } }
                  public double RequestedRopeLength { get { return requestedLength; } }''',
          '''        public double RopeTotalLength { get { return desktopRope.TotalLength; } }
                  public double RequestedRopeLength { get { return ScaleLength(requestedLength); } }
                  public double MaximumTongueLength { get { return ScaleLength(LargeElasticRopeLength); } }''')

          replace_once(abilities,
          '''                double stretch = MathUtil.Lerp(200.0,
                              Math.Min(requestedLength, 200.0), 0.5) /
                              (desktopRope.TotalLength + 80.0);''',
          '''                double totalRope = ScaleLength(LargeElasticRopeLength);
                          double stretch = MathUtil.Lerp(totalRope,
                              Math.Min(ScaleLength(requestedLength), totalRope), 0.5) /
                              (desktopRope.TotalLength + ScaleLength(LargeRopePadding));''')

          replace_once(abilities,
          '''            get { return string.Format("tongue:{0} rope:{1:0}/{2:0}", mode,
                          Vec2.Distance(Owner.BodyChunks[0].Position, position), idealLength); }''',
          '''            get { return string.Format("tongue:{0} rope:{1:0}/{2:0}", mode,
                          Vec2.Distance(Owner.BodyChunks[0].Position, position),
                          ScaleLength(idealLength)); }''')

          replace_once(abilities,
          '''                if (input.Y < 0) idealLength = Math.Max(50.0, idealLength - 3.0);
                          if (input.Y > 0) idealLength = Math.Min(170.0, idealLength + 3.0);''',
          '''                if (input.Y < 0) idealLength = Math.Max(
                              LargeMinimumIdealLength, idealLength - 3.0);
                          if (input.Y > 0) idealLength = Math.Min(
                              LargeMaximumIdealLength, idealLength + 3.0);''')

          replace_once(abilities,
          '''                    requestedLength = Vec2.Distance(mouth, anchor);''',
          '''                    requestedLength = Vec2.Distance(mouth, anchor) /
                                  Math.Max(0.000001, TongueScale);''')

          replace_once(abilities,
          '''                if (distance > 500.0 ||''',
          '''                if (distance > ScaleLength(LargeSafetyLength) ||''')

          replace_once(abilities,
          '''                requestedLength = Math.Max(0.0, requestedLength - 4.0);
                          velocity.Y += 0.9 - 0.8 *
                              MathUtil.InverseLerp(0.0, 1.0, elastic);''',
          '''                requestedLength = Math.Max(0.0, requestedLength - 4.0);
                          velocity.Y += (0.9 - 0.8 *
                              MathUtil.InverseLerp(0.0, 1.0, elastic)) * TongueScale;''')

          replace_once(abilities,
          '''                    if (returning && Vec2.Distance(mouth, position) < 40.0)''',
          '''                    if (returning && Vec2.Distance(mouth, position) <
                                      ScaleLength(LargeReturnDistance))''')

          replace_once(abilities,
          '''            position = mouth + direction * 5.0;
                  velocity = direction * 70.0;
                  requestedLength = 140.0;''',
          '''            position = mouth + direction * ScaleLength(LargeShotOffset);
                  velocity = direction * ScaleLength(LargeShotSpeed);
                  requestedLength = LargeRequestedLength;''')

          replace_once(abilities,
          '''        private static Vec2 AutoAim(DesktopCollisionWorld world, Vec2 from, Vec2 direction)
                  {
                      if (RayIsClear(world, from, from + direction * 230.0)) return direction;''',
          '''        private Vec2 AutoAim(DesktopCollisionWorld world, Vec2 from, Vec2 direction)
                  {
                      double aimDistance = ScaleLength(LargeAutoAimDistance);
                      if (RayIsClear(world, from, from + direction * aimDistance)) return direction;''')

          replace_once(abilities,
          '''                if (RayIsClear(world, from, from + left * 230.0)) return left;
                          Vec2 right = Rotate(direction, angle * Math.PI / 180.0);
                          if (RayIsClear(world, from, from + right * 230.0)) return right;''',
          '''                if (RayIsClear(world, from, from + left * aimDistance)) return left;
                          Vec2 right = Rotate(direction, angle * Math.PI / 180.0);
                          if (RayIsClear(world, from, from + right * aimDistance)) return right;''')

          replace_once(abilities,
          '''            const double onRopePosition = 1.0;
                  const double totalRope = 200.0;
                  double requestRope = Math.Min(requestedLength,
                      onRopePosition * totalRope);''',
          '''            const double onRopePosition = 1.0;
                  double totalRope = ScaleLength(LargeElasticRopeLength);
                  double requestRope = Math.Min(ScaleLength(requestedLength),
                      onRopePosition * totalRope);''')

          replace_once(abilities,
          '''        private static bool FindFirstSurfaceHit(DesktopCollisionWorld world, Vec2 from,''',
          '''        private double TongueScale
                  {
                      get { return Owner.SizeMovementScale; }
                  }

                  private double ScaleLength(double largeSizeLength)
                  {
                      return largeSizeLength * TongueScale;
                  }

                  private static bool FindFirstSurfaceHit(DesktopCollisionWorld world, Vec2 from,''')

          graphics = "src/RainWorldDesktopPet/Graphics/SlugcatGraphics.cs"
          replace_once(graphics,
          '''                    for (int i = 0; i < slugcat.Spears.Count; i++)
                              {
                                  if (slugcat.Spears[i].NeedleHasConnection)
                                      slugcat.Spears[i].SetConnectionAnchor(
                                          tail.Segments[2].Position);
                              }''',
          '''                    for (int i = 0; i < slugcat.Spears.Count; i++)
                              {
                                  if (!slugcat.Spears[i].HasUmbilical) continue;
                                  slugcat.Spears[i].SetConnectionAnchor(
                                      tail.Segments[2].Position);
                                  slugcat.Spears[i].SetConnectionScale(
                                      slugcat.SizeMovementScale);
                              }''')

          replace_once(graphics,
          '''                spearAbility.HeldSpear.SetConnectionAnchor(
                              tail.Segments.Length > 2 ? tail.Segments[2].Position :
                              slugcat.BodyChunks[1].Position);''',
          '''                spearAbility.HeldSpear.SetConnectionAnchor(
                              tail.Segments.Length > 2 ? tail.Segments[2].Position :
                              slugcat.BodyChunks[1].Position);
                          spearAbility.HeldSpear.SetConnectionScale(slugcat.SizeMovementScale);''')

          renderer = "src/RainWorldDesktopPet/Graphics/SpriteRenderer.cs"
          replace_once(renderer,
          '''                        if (worldAnchored)
                                  {
                                      previous = pose.ToCharacterRenderSpaceForWorld(previous);
                                      next = pose.ToCharacterRenderSpaceForWorld(next);
                                  }''',
          '''                        if (worldAnchored)
                                  {
                                      ResolveUmbilicalRenderEndpoints(pose, center, direction,
                                          segment, current.Length, ref previous, ref next);
                                  }''')

          replace_once(renderer,
          '''        private static void FillCircle(ISpriteCanvas graphics, Vec2 center, double radius, Color color)''',
          '''        internal static void ResolveUmbilicalRenderEndpoints(SlugcatPose pose,
                      Vec2 spearCenter, Vec2 spearDirection, int segment, int pointCount,
                      ref Vec2 previous, ref Vec2 next)
                  {
                      if (pose == null) throw new ArgumentNullException("pose");
                      // The first endpoint belongs to the scaled character/tail, while
                      // intermediate points are free world-space particles. The last
                      // endpoint belongs to the scaled spear sprite. Mixing these spaces
                      // deliberately keeps both ends visually welded after size changes.
                      if (segment == 1 && pose.Tail != null && pose.Tail.Length > 2)
                          previous = pose.Tail[2];
                      else
                          previous = pose.ToCharacterRenderSpaceForWorld(previous);

                      if (segment == pointCount - 1)
                          next = spearCenter - spearDirection * 25.0;
                      else
                          next = pose.ToCharacterRenderSpaceForWorld(next);
                  }

                  private static void FillCircle(ISpriteCanvas graphics, Vec2 center, double radius, Color color)''')

          tests = "tests/RainWorldDesktopPet.Tests/AbilityParityReplayTests.cs"
          replace_once(tests,
          '''            run("Spearmaster throw uses ThrowObject velocity and needle gravity",
                          SpearmasterThrowReplay);''',
          '''            run("Spearmaster throw uses ThrowObject velocity and needle gravity",
                          SpearmasterThrowReplay);
                      run("Spearmaster umbilical endpoints follow scaled tail and spear",
                          SpearmasterUmbilicalEndpointsFollowScaledVisuals);''')

          replace_once(tests,
          '''            run("Saint replay shoots, attaches and jump-releases through Tongue states",
                          SaintTongueReplay);''',
          '''            run("Saint replay shoots, attaches and jump-releases through Tongue states",
                          SaintTongueReplay);
                      run("Saint tongue reach follows the selected Slugcat size",
                          SaintTongueReachScalesWithSize);''')

          marker = '''        private static void RivuletMovementReplay()
                  {'''
          addition = '''        private static void SpearmasterUmbilicalEndpointsFollowScaledVisuals()
                  {
                      double size = SlugcatSizeSettings.SmallMultiplier;
                      DesktopCollisionWorld world = CreateAirWorld();
                      DesktopSpear spear = new DesktopSpear(new Vec2(120.0, 90.0), 0);
                      Vec2 tailAnchor = new Vec2(80.0, 105.0);
                      spear.SetConnectionAnchor(tailAnchor);
                      spear.SetConnectionScale(size);
                      spear.Throw(new Vec2(12.0, 0.0), Vec2.Right);
                      spear.Step(world);
                      spear.SetConnectionAnchor(tailAnchor + new Vec2(6.0, -4.0));
                      spear.SetConnectionScale(size);
                      True(spear.HasUmbilical, "thrown needle creates an umbilical");
                      Near(0.0, Vec2.Distance(tailAnchor + new Vec2(6.0, -4.0),
                          spear.Umbilical[0]), 0.000001,
                          "live tail endpoint snaps to the current tail hole");
                      int last = spear.Umbilical.Length - 1;
                      Vec2 expectedSpearEnd = spear.Chunk.Position - spear.Rotation *
                          (25.0 * size);
                      Near(0.0, Vec2.Distance(expectedSpearEnd, spear.Umbilical[last]),
                          0.000001, "physical spear endpoint follows scaled spear length");

                      SlugcatPose pose = new SlugcatPose();
                      pose.CharacterOrigin = new Vec2(100.0, 100.0);
                      pose.CharacterRenderScale = SimulationConstants.CharacterRenderScale * size;
                      pose.Tail = new Vec2[]
                      {
                          new Vec2(96.0, 103.0), new Vec2(93.0, 107.0),
                          new Vec2(89.0, 111.0), new Vec2(85.0, 114.0)
                      };
                      Vec2 spearWorldCenter = new Vec2(180.0, 110.0);
                      Vec2 renderCenter = pose.ToCharacterRenderSpaceForWorld(spearWorldCenter);
                      Vec2 previous = new Vec2(90.0, 108.0);
                      Vec2 next = new Vec2(120.0, 109.0);
                      SpriteRenderer.ResolveUmbilicalRenderEndpoints(pose, renderCenter,
                          Vec2.Right, 1, 4, ref previous, ref next);
                      Near(0.0, Vec2.Distance(pose.ToRenderedWorld(pose.Tail[2]),
                          pose.ToRenderedWorld(previous)), 0.000001,
                          "rendered first endpoint is welded to the scaled tail hole");

                      previous = new Vec2(145.0, 110.0);
                      next = new Vec2(170.0, 110.0);
                      SpriteRenderer.ResolveUmbilicalRenderEndpoints(pose, renderCenter,
                          Vec2.Right, 3, 4, ref previous, ref next);
                      Vec2 renderedSpearCenter = pose.ToRenderedStaticWorld(spearWorldCenter);
                      Vec2 expectedRenderedSpearEnd = renderedSpearCenter -
                          Vec2.Right * (25.0 * pose.CharacterRenderScale);
                      Near(0.0, Vec2.Distance(expectedRenderedSpearEnd,
                          pose.ToRenderedWorld(next)), 0.000001,
                          "rendered last endpoint is welded to the scaled spear sprite");
                  }

                  private static void RivuletMovementReplay()
                  {'''
          replace_once(tests, marker, addition)

          marker = '''        private static void GourmandRollReplay()
                  {'''
          addition = '''        private static void SaintTongueReachScalesWithSize()
                  {
                      double[] scales =
                      {
                          SlugcatSizeSettings.SmallMultiplier,
                          SlugcatSizeSettings.NormalMultiplier,
                          SlugcatSizeSettings.LargeMultiplier
                      };
                      double[] normalizedReach = new double[scales.Length];
                      for (int index = 0; index < scales.Length; index++)
                      {
                          DesktopCollisionWorld world = CreateAirWorld();
                          Slugcat saint = CreateAirSlugcat(SlugcatId.Saint);
                          saint.SetSizeScale(scales[index]);
                          saint.State.Grounded = false;
                          SaintAbilityController ability =
                              (SaintAbilityController)saint.AbilityController;
                          Near(200.0 * scales[index], ability.MaximumTongueLength,
                              0.000001, "scaled maximum tongue length " + index);
                          saint.Step(new VirtualInput(0, -1, true, false), world,
                              Vec2.Zero, Vec2.Zero);
                          Near(140.0 * scales[index], ability.RequestedRopeLength,
                              0.000001, "scaled initial requested length " + index);
                          double maximum = Vec2.Distance(saint.BodyChunks[0].Position,
                              ability.TonguePosition);
                          for (int tick = 0; tick < 6; tick++)
                          {
                              saint.Step(VirtualInput.Neutral, world, Vec2.Zero, Vec2.Zero);
                              maximum = Math.Max(maximum, Vec2.Distance(
                                  saint.BodyChunks[0].Position, ability.TonguePosition));
                          }
                          normalizedReach[index] = maximum / scales[index];
                      }
                      Near(normalizedReach[2], normalizedReach[0], 0.01,
                          "Small tongue keeps Large spatial reach ratio");
                      Near(normalizedReach[2], normalizedReach[1], 0.01,
                          "Normal tongue keeps Large spatial reach ratio");
                  }

                  private static void GourmandRollReplay()
                  {'''
          replace_once(tests, marker, addition)

          Path(".github/workflows/temp-tether-tongue-fix.yml").unlink()
          '@ | Set-Content -Encoding UTF8 apply_tether_tongue_fix.py
          python apply_tether_tongue_fix.py
          Remove-Item apply_tether_tongue_fix.py

      - name: Build Release and run tests
        shell: powershell
        run: .\build.ps1 -Configuration Release

      - name: Commit verified fix
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: scale Saint tongue and align Spearmaster tether"
          git push origin HEAD:fix/spearmaster-tether-saint-size
