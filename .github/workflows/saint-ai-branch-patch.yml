name: Saint tongue AI branch patch

on:
  push:
    branches:
      - fix/saint-tongue-ai-frequency

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/saint-tongue-ai-frequency

      - name: Tune Saint tongue AI
        shell: pwsh
        run: |
          $path = 'src/RainWorldDesktopPet/AI/DesktopPetAI.cs'
          $text = [IO.File]::ReadAllText($path)

          function Replace-One([string]$pattern, [string]$replacement, [string]$label) {
            $matches = [regex]::Matches($script:text, $pattern)
            if ($matches.Count -ne 1) {
              throw "$label expected exactly one match, found $($matches.Count)."
            }
            $script:text = [regex]::Replace($script:text, $pattern, $replacement, 1)
          }

          Replace-One '\? 195\.0 : \(slugcat\.AbilityController is ArtificerAbilityController \? 250\.0 : 105\.0\);' '? 220.0 : (slugcat.AbilityController is ArtificerAbilityController ? 250.0 : 105.0);' 'Saint traversal range'
          Replace-One '0\.34, 0\.72, 0\.32, 0\.22, 0\.90, 0\.62, 0\.88, 0\.18, 0\.64, 0\.94, 0\.72, 0\.86, 0\.18, 0\.62\);' '0.34, 0.72, 0.32, 0.22, 0.90, 0.62, 0.88, 0.18, 0.64, 0.94, 0.72, 0.86, 0.18, 0.82);' 'Saint special-use profile'
          $plannedReplacement = 'Math.Abs(TransitionPlan.HorizontalDistance) >= 28.0 ||' + [Environment]::NewLine + '                 TransitionPlan.VerticalDistance <= -12.0'
          Replace-One 'Math\.Abs\(TransitionPlan\.HorizontalDistance\) >= 42\.0 \|\|\r?\n\s+TransitionPlan\.VerticalDistance <= -20\.0' $plannedReplacement 'Saint planned tongue threshold'
          Replace-One 'saintFreestyleCooldownTicks = SecondsToTicks\(SampleCentered\(1\.6, 4\.0\)\);' 'saintFreestyleCooldownTicks = SecondsToTicks(SampleCentered(0.9, 2.2));' 'Saint freestyle cooldown'
          $chanceReplacement = 'return MathUtil.Clamp01(0.28 + curiosity * 0.16 +' + [Environment]::NewLine + '                playfulness * 0.10 + traitSpecialUse * 0.18 +' + [Environment]::NewLine + '                (mood == AIMood.Curious ? 0.08 : 0.0));'
          Replace-One 'return MathUtil\.Clamp01\(0\.12 \+ curiosity \* 0\.10 \+\r?\n\s+playfulness \* 0\.07 \+ traitSpecialUse \* 0\.09 \+\r?\n\s+\(mood == AIMood\.Curious \? 0\.05 : 0\.0\)\);' $chanceReplacement 'Saint freestyle chance'

          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))

      - name: Build Release and run tests
        shell: pwsh
        run: .\build.ps1 -Configuration Release

      - name: Check DMS validator syntax
        shell: pwsh
        run: node --check tools/validate-dms-template.mjs

      - name: Commit tested Saint AI change
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/saint-ai-branch-patch.yml
          git add src/RainWorldDesktopPet/AI/DesktopPetAI.cs
          git commit -m "Increase Saint tongue traversal use"
          git push origin HEAD:fix/saint-tongue-ai-frequency
