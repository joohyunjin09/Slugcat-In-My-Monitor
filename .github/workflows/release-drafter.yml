name: Release Drafter

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: read

jobs:
  publish-release:
    name: Publish release and start packaging
    runs-on: ubuntu-latest
    steps:
      - name: Detect the first stable release
        id: baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 \
            --json tagName --jq '.[].tagName' |
            grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "first=false" >> "$GITHUB_OUTPUT"
          else
            echo "first=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the prepared v0.1.0 release
        if: steps.baseline.outputs.first == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v0.1.0 --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Draft and publish the next release
        if: steps.baseline.outputs.first != 'true'
        id: drafter
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the published tag
        id: release
        shell: bash
        env:
          FIRST_RELEASE: ${{ steps.baseline.outputs.first }}
          DRAFTER_TAG: ${{ steps.drafter.outputs.tag_name }}
        run: |
          if [[ "$FIRST_RELEASE" == "true" ]]; then
            tag="v0.1.0"
          else
            tag="$DRAFTER_TAG"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Start the Windows release build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main \
            --field version="$RELEASE_TAG"
