name: Release build

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Existing v-prefixed GitHub Release tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and attach Windows package
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Resolve release tag
        id: release
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $tag = "${{ github.event.release.tag_name }}"
          } else {
            $tag = "${{ inputs.version }}"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Release tag must look like v0.1.0: $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.release.outputs.tag }}

      - name: Build Release and run tests
        shell: powershell
        run: .\build.ps1 -Configuration Release

      - name: Create distribution archive
        shell: powershell
        run: .\package.ps1 -Version "${{ steps.release.outputs.tag }}" -SkipBuild

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlugcatInMyMonitor-${{ steps.release.outputs.tag }}
          if-no-files-found: error
          path: |
            artifacts/package/SlugcatInMyMonitor-${{ steps.release.outputs.tag }}-win-x64.zip
            artifacts/package/SlugcatInMyMonitor-${{ steps.release.outputs.tag }}-win-x64.zip.sha256

      - name: Attach package to GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $zip = "artifacts/package/SlugcatInMyMonitor-$tag-win-x64.zip"
          gh release upload $tag $zip "$zip.sha256" --clobber --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw "Unable to upload assets to release $tag." }
