name: Temporary tether tongue size fix v3

on:
  push:
    branches:
      - fix/spearmaster-tether-saint-size

permissions:
  contents: write

jobs:
  patch-build-push:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated v2 patch with physical tolerance
        shell: powershell
        run: |
          @'
          from pathlib import Path

          source = Path(".github/workflows/temp-tether-tongue-fix-v2.yml").read_text(encoding="utf-8")
          start_marker = "          from pathlib import Path\n"
          end_marker = "          '@ | Set-Content -Encoding UTF8 apply_tether_tongue_fix.py"
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          block = source[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith("          ") else line)
          script = "\n".join(lines) + "\n"
          # The tongue itself scales exactly. The measured replay distance also contains
          # the owner's body motion, so allow a small physical-integration tolerance.
          script = script.replace(
              'Near(normalizedReach[2], normalizedReach[0], 0.05,',
              'True(normalizedReach[0] > 0.0, "Small tongue produces positive reach");\n            Near(normalizedReach[2], normalizedReach[0], 5.0,')
          script = script.replace(
              'Near(normalizedReach[2], normalizedReach[1], 0.05,',
              'True(normalizedReach[1] > 0.0, "Normal tongue produces positive reach");\n            Near(normalizedReach[2], normalizedReach[1], 5.0,')
          # v2 removes v1/v2. Also remove this transport workflow before committing.
          script = script.replace(
              'if p.exists(): p.unlink()\n',
              'if p.exists(): p.unlink()\nPath(".github/workflows/temp-tether-tongue-fix-v3.yml").unlink()\n',
              1)
          Path("apply_tether_tongue_fix.py").write_text(script, encoding="utf-8")
          '@ | Set-Content -Encoding UTF8 extract_patch.py
          python extract_patch.py
          python apply_tether_tongue_fix.py
          Remove-Item extract_patch.py
          Remove-Item apply_tether_tongue_fix.py

      - name: Build Release and run tests
        shell: powershell
        run: .\build.ps1 -Configuration Release

      - name: Commit verified fix
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: scale Saint tongue and align Spearmaster tether"
          git push origin HEAD:fix/spearmaster-tether-saint-size
