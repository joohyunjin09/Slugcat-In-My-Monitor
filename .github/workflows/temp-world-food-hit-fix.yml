name: Temporary world food mouse hit fix

on:
  push:
    branches:
      - fix/world-food-mouse-hit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-push:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/world-food-mouse-hit
          fetch-depth: 0

      - name: Patch world food mouse hit coordinates
        shell: powershell
        run: python .github/temp-world-food-hit-patch.py

      - name: Build Release and run tests
        shell: powershell
        run: .\build.ps1 -Configuration Release

      - name: Check DMS validator syntax
        shell: powershell
        run: node --check tools/validate-dms-template.mjs

      - name: Commit validated fix
        shell: powershell
        run: |
          Remove-Item .github/workflows/temp-world-food-hit-fix.yml
          Remove-Item .github/temp-world-food-hit-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: align world food mouse hit areas"
          git push origin HEAD:fix/world-food-mouse-hit
