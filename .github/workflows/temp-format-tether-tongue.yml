name: Temporary tether tongue formatting

on:
  push:
    branches:
      - fix/spearmaster-tether-saint-size

permissions:
  contents: write

jobs:
  format-build-push:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize formatting
        shell: powershell
        run: |
          @'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          abilities = "src/RainWorldDesktopPet/Creature/SlugcatAbilities.cs"
          replace_once(abilities,
          '''                if (input.Y < 0) idealLength = Math.Max(
                      LargeMinimumIdealLength, idealLength - 3.0);
                  if (input.Y > 0) idealLength = Math.Min(
                      LargeMaximumIdealLength, idealLength + 3.0);''',
          '''                if (input.Y < 0)
                      idealLength = Math.Max(LargeMinimumIdealLength,
                          idealLength - 3.0);
                  if (input.Y > 0)
                      idealLength = Math.Min(LargeMaximumIdealLength,
                          idealLength + 3.0);''')
          replace_once(abilities,
          '''                velocity.Y += (0.9 - 0.8 *
                      MathUtil.InverseLerp(0.0, 1.0, elastic)) * TongueScale;''',
          '''                velocity.Y += (0.9 - 0.8 *
                      MathUtil.InverseLerp(0.0, 1.0, elastic)) * TongueScale;''')
          replace_once(abilities,
          '''            const double onRopePosition = 1.0;
              double totalRope = ScaleLength(LargeElasticRopeLength);
              double requestRope = Math.Min(ScaleLength(requestedLength),
                  onRopePosition * totalRope);''',
          '''            const double onRopePosition = 1.0;
                  double totalRope = ScaleLength(LargeElasticRopeLength);
                  double requestRope = Math.Min(ScaleLength(requestedLength),
                      onRopePosition * totalRope);''')

          graphics = "src/RainWorldDesktopPet/Graphics/SlugcatGraphics.cs"
          replace_once(graphics,
          '''                spearAbility.HeldSpear.SetConnectionAnchor(
                      tail.Segments.Length > 2 ? tail.Segments[2].Position :
                      slugcat.BodyChunks[1].Position);
                  spearAbility.HeldSpear.SetConnectionScale(slugcat.SizeMovementScale);''',
          '''                spearAbility.HeldSpear.SetConnectionAnchor(
                      tail.Segments.Length > 2 ? tail.Segments[2].Position :
                      slugcat.BodyChunks[1].Position);
                  spearAbility.HeldSpear.SetConnectionScale(
                      slugcat.SizeMovementScale);''')

          Path(".github/workflows/temp-format-tether-tongue.yml").unlink()
          '@ | Set-Content -Encoding UTF8 format_patch.py
          python format_patch.py
          Remove-Item format_patch.py

      - name: Build Release and run tests
        shell: powershell
        run: .\build.ps1 -Configuration Release

      - name: Commit formatting
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: normalize tether tongue formatting"
          git push origin HEAD:fix/spearmaster-tether-saint-size
