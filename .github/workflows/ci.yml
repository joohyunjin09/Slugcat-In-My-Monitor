name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
      - codex/rain-world-fidelity-overhaul
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-pr3-ai:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/rain-world-fidelity-overhaul'
    name: Patch PR 3 AI regression
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/rain-world-fidelity-overhaul
          fetch-depth: 4

      - name: Remove fabricated Gourmand fall-roll input
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'src/RainWorldDesktopPet/AI/DesktopPetAI.cs'
          $text = [IO.File]::ReadAllText($path).Replace("`r`n", "`n")
          $startToken = "            GourmandAbilityController gourmand =`n"
          $endToken = "            if (!TransitionPlan.IsValid) return false;"
          $start = $text.IndexOf($startToken, [StringComparison]::Ordinal)
          if ($start -lt 0) { throw 'Gourmand AI start token was not found.' }
          $end = $text.IndexOf($endToken, $start, [StringComparison]::Ordinal)
          if ($end -lt 0) { throw 'Post-Gourmand transition token was not found.' }
          $replacement = "            // Falling alone is not Player.downDiagonal. Gourmand roll entry must`n" +
              "            // come from an explicit movement intent rather than fabricated AI input.`n`n"
          $text = $text.Substring(0, $start) + $replacement + $text.Substring($end)
          [IO.File]::WriteAllText($path, $text, (New-Object Text.UTF8Encoding($false)))
          git diff --check
          git diff -- $path

      - name: Build Release and run tests
        shell: powershell
        run: .\build.ps1 -Configuration Release

      - name: Commit validated source fix and restore CI
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout HEAD^^^ -- .github/workflows/ci.yml
          git add -- .github/workflows/ci.yml src/RainWorldDesktopPet/AI/DesktopPetAI.cs
          git commit -m "fix: prevent fabricated Gourmand fall-roll input"
          git push origin HEAD:codex/rain-world-fidelity-overhaul

  build-and-test:
    if: github.event_name != 'push' || github.ref != 'refs/heads/codex/rain-world-fidelity-overhaul'
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Release and run tests
        shell: powershell
        run: .\build.ps1 -Configuration Release

      - name: Check DMS validator syntax
        shell: powershell
        run: node --check tools/validate-dms-template.mjs

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SlugcatInMyMonitor-${{ github.sha }}
          if-no-files-found: error
          path: |
            artifacts/Release/SlugcatInMyMonitor.exe
            artifacts/Release/SlugcatInMyMonitor.exe.config
            README.md
            LICENSE
