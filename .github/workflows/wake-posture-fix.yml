name: Wake posture movement fix

on:
  push:
    branches:
      - fix/wake-posture-on-move

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/wake-posture-on-move

      - name: Fix rest posture wake transition
        shell: pwsh
        run: |
          $path = 'src/RainWorldDesktopPet/Creature/OriginalSlugcatMovement.cs'
          $text = [IO.File]::ReadAllText($path)
          $old = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('')).Replace("`n", [Environment]::NewLine)
          $new = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('')).Replace("`n", [Environment]::NewLine)
          if (-not $text.Contains($old)) { throw 'posture block not found' }
          $text = $text.Replace($old, $new)
          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))

          $testPath = 'tests/RainWorldDesktopPet.Tests/Program.cs'
          $tests = [IO.File]::ReadAllText($testPath)
          $runOld = '            Run("Sit and sleep flow through VirtualInput into movement", RestPosturesUseVirtualInput);'
          $runNew = $runOld + [Environment]::NewLine + '            Run("Movement wakes a curled rest posture before locomotion", MovementWakesRestPosture);'
          if (-not $tests.Contains($runOld)) { throw 'test registration anchor not found' }
          $tests = $tests.Replace($runOld, $runNew)
          $methodAnchor = '        private static void StandForcesKeepUpperBodyUpright()'
          $method = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('')).Replace("`n", [Environment]::NewLine)
          if (-not $tests.Contains($methodAnchor)) { throw 'test method anchor not found' }
          $tests = $tests.Replace($methodAnchor, $method + $methodAnchor)
          [IO.File]::WriteAllText($testPath, $tests, [Text.UTF8Encoding]::new($false))

      - name: Build Release and run tests
        shell: pwsh
        run: .\build.ps1 -Configuration Release

      - name: Check DMS validator syntax
        shell: pwsh
        run: node --check tools/validate-dms-template.mjs

      - name: Commit tested fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wake-posture-fix.yml
          git add src/RainWorldDesktopPet/Creature/OriginalSlugcatMovement.cs tests/RainWorldDesktopPet.Tests/Program.cs
          git commit -m "Wake rest posture before movement"
          git push origin HEAD:fix/wake-posture-on-move
