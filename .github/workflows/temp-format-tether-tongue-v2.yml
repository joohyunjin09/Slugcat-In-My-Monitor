name: Temporary tether tongue formatting v2

on:
  push:
    branches:
      - fix/spearmaster-tether-saint-size

permissions:
  contents: write

jobs:
  format-build-push:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize formatting
        shell: powershell
        run: |
          @'
          from pathlib import Path
          import re

          def sub_once(path, pattern, replacement):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              new, count = re.subn(pattern, replacement, text, count=1, flags=re.M)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}\n{pattern}")
              p.write_text(new, encoding="utf-8")

          abilities = "src/RainWorldDesktopPet/Creature/SlugcatAbilities.cs"
          sub_once(abilities,
              r'^                if \(input\.Y < 0\) idealLength = Math\.Max\(\n\s*LargeMinimumIdealLength, idealLength - 3\.0\);\n\s*if \(input\.Y > 0\) idealLength = Math\.Min\(\n\s*LargeMaximumIdealLength, idealLength \+ 3\.0\);',
              '''                if (input.Y < 0)
                      idealLength = Math.Max(LargeMinimumIdealLength,
                          idealLength - 3.0);
                  if (input.Y > 0)
                      idealLength = Math.Min(LargeMaximumIdealLength,
                          idealLength + 3.0);''')
          sub_once(abilities,
              r'^                velocity\.Y \+= \(0\.9 - 0\.8 \*\n\s*MathUtil\.InverseLerp\(0\.0, 1\.0, elastic\)\) \* TongueScale;',
              '''                velocity.Y += (0.9 - 0.8 *
                      MathUtil.InverseLerp(0.0, 1.0, elastic)) * TongueScale;''')
          sub_once(abilities,
              r'^            const double onRopePosition = 1\.0;\n\s*double totalRope = ScaleLength\(LargeElasticRopeLength\);\n\s*double requestRope = Math\.Min\(ScaleLength\(requestedLength\),\n\s*onRopePosition \* totalRope\);',
              '''            const double onRopePosition = 1.0;
                  double totalRope = ScaleLength(LargeElasticRopeLength);
                  double requestRope = Math.Min(ScaleLength(requestedLength),
                      onRopePosition * totalRope);''')

          graphics = "src/RainWorldDesktopPet/Graphics/SlugcatGraphics.cs"
          sub_once(graphics,
              r'^                spearAbility\.HeldSpear\.SetConnectionAnchor\(\n\s*tail\.Segments\.Length > 2 \? tail\.Segments\[2\]\.Position :\n\s*slugcat\.BodyChunks\[1\]\.Position\);\n\s*spearAbility\.HeldSpear\.SetConnectionScale\(slugcat\.SizeMovementScale\);',
              '''                spearAbility.HeldSpear.SetConnectionAnchor(
                      tail.Segments.Length > 2 ? tail.Segments[2].Position :
                      slugcat.BodyChunks[1].Position);
                  spearAbility.HeldSpear.SetConnectionScale(
                      slugcat.SizeMovementScale);''')

          for helper in [
              ".github/workflows/temp-format-tether-tongue.yml",
              ".github/workflows/temp-format-tether-tongue-v2.yml"
          ]:
              p = Path(helper)
              if p.exists(): p.unlink()
          '@ | Set-Content -Encoding UTF8 format_patch.py
          python format_patch.py
          Remove-Item format_patch.py

      - name: Build Release and run tests
        shell: powershell
        run: .\build.ps1 -Configuration Release

      - name: Commit formatting
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: normalize tether tongue formatting"
          git push origin HEAD:fix/spearmaster-tether-saint-size
