name: Tune crawl frequency on develop

on:
  push:
    branches: [ develop ]
    paths:
      - '.github/workflows/tune-crawl-frequency-develop.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-latest
    steps:
      - name: Check out develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Tune crawl frequency and standing transition
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('src/RainWorldDesktopPet/AI/DesktopPetAI.cs')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new):
              global text
              if old not in text:
                  raise SystemExit('pattern not found: ' + old[:100])
              text = text.replace(old, new, 1)

          replace_once(
              '''                double score = UtilityEvaluator.Score(candidate, context, variation);\n                score = ApplyIntentContinuity(candidate, score, urgentAvoid, urgentClimb);\n                if (candidate == DesktopBehavior.Jump &&\n''',
              '''                double score = UtilityEvaluator.Score(candidate, context, variation);\n                score = ApplyIntentContinuity(candidate, score, urgentAvoid, urgentClimb);\n                // Crawl remains a valid personality/rest behavior, but it should be\n                // occasional rather than competing evenly with normal locomotion.\n                if (candidate == DesktopBehavior.Crawl) score *= 0.48;\n                if (candidate == DesktopBehavior.Jump &&\n''')

          replace_once(
              '''                case DesktopBehavior.Crawl: minimum = 0.8; maximum = 6.5; break;\n''',
              '''                case DesktopBehavior.Crawl: minimum = 0.35; maximum = 2.4; break;\n''')

          replace_once(
              '''            int towardMouse = mouse.Position.X < slugcat.Center.X ? -1 : 1;\n            switch (Behavior)\n''',
              '''            int towardMouse = mouse.Position.X < slugcat.Center.X ? -1 : 1;\n            // Releasing Crawl/brief crouch to neutral Y can leave Player.Standing\n            // false. Upright locomotion therefore sends the original up intent\n            // while grounded until the movement state has actually stood up.\n            int uprightY = context.Grounded && !slugcat.State.Standing ? -1 : 0;\n            switch (Behavior)\n''')

          replace_once(
              '''                case DesktopBehavior.Explore:\n                    return new VirtualInput(desiredDirection, 0, false, false);\n''',
              '''                case DesktopBehavior.Explore:\n                    return new VirtualInput(desiredDirection, uprightY, false, false);\n''')
          replace_once(
              '''                    return new VirtualInput(desiredDirection, 0, false, false);\n                case DesktopBehavior.TurnAround:\n                    return new VirtualInput(desiredDirection, 0, false, false);\n''',
              '''                    return new VirtualInput(desiredDirection, uprightY, false, false);\n                case DesktopBehavior.TurnAround:\n                    return new VirtualInput(desiredDirection, uprightY, false, false);\n''')
          replace_once(
              '''                    return new VirtualInput(towardMouse, 0, context.Grounded &&\n                        mouse.Position.Y < slugcat.Center.Y - 80.0, false);\n''',
              '''                    return new VirtualInput(towardMouse, uprightY, context.Grounded &&\n                        mouse.Position.Y < slugcat.Center.Y - 80.0, false);\n''')
          replace_once(
              '''                    return new VirtualInput(-towardMouse, 0, context.Grounded &&\n                        context.MouseDistance < 55.0, false);\n''',
              '''                    return new VirtualInput(-towardMouse, uprightY, context.Grounded &&\n                        context.MouseDistance < 55.0, false);\n''')

          path.write_text(text, encoding='utf-8')
          '@ | python -

      - name: Build Release and run tests
        shell: pwsh
        run: .\build.ps1 -Configuration Release

      - name: Check DMS validator syntax
        shell: pwsh
        run: node --check tools/validate-dms-template.mjs

      - name: Commit tested crawl tuning
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tune-crawl-frequency-develop.yml
          git add src/RainWorldDesktopPet/AI/DesktopPetAI.cs
          git commit -m "Reduce excessive crawling"
          $pushed = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            git push origin HEAD:develop
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $pushed) { throw "Could not push tested crawl tuning after retries." }
